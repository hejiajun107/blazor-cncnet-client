name: Build and package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Windows x64 Release package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/BlazorCncnetClient/CnCNetClient.sln

      - name: Build solution
        run: dotnet build src/BlazorCncnetClient/CnCNetClient.sln --configuration Release --no-restore

      - name: Publish self-contained Windows package
        shell: pwsh
        run: ./tools/publish.ps1 -Configuration Release -Runtime win-x64 -OutputDir artifacts

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/BlazorCncnetClient-win-x64.zip -CompressionLevel Optimal

      - name: Upload downloadable package
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/BlazorCncnetClient-win-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
