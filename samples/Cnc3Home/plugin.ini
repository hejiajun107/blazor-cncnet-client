; CNC3 风格主页示例插件（F4）
; 部署：游戏根 Plugins/cnc3-home/，并在 Resources/ClientDefinitions.ini 的 [Plugins] 追加
;       cnc3-home=Plugins/cnc3-home

[Plugin]
Id=cnc3-home
Name=CNC3 风格主页
ApiVersion=1
Assembly=Cnc3Home.dll
EntryType=Cnc3Home.Cnc3HomePluginEntry
; 自带样式（相对本目录）
Style=plugin.css
; 自带脚本：挂载 three.js 地球（脚本内部再按需加载 assets/three.min.js）
Script=cnc3-home.js
