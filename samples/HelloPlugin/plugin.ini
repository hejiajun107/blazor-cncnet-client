; 示例插件自描述（F4）—— 与插件 DLL 同级，放在游戏根 Plugins/<目录>/plugin.ini
;
; 客户端启动时读 Resources/ClientDefinitions.ini 的 [Plugins] 节得到启用列表，
; 再按本文件加载插件程序集。

[Plugin]
; 插件唯一标识（与目录名/ClientDefinitions.ini 键一致，日志与菜单项用）
Id=hello-plugin
; 展示名
Name=示例：你好插件
; 编译时针对的插件契约版本，须等于宿主 PluginApi.CurrentVersion（不匹配 → 禁用并记日志）
ApiVersion=1
; 入口程序集文件名（可省略：省略时遍历本目录内 *.dll 探测 EntryType）
Assembly=HelloPlugin.dll
; 入口类型全名（必须实现 CnCNetClient.Plugin.Abstractions.ICncNetPlugin）
EntryType=HelloPlugin.HelloPluginEntry
; 自带样式（相对本目录；空 = 不注入）
Style=plugin.css
; 自带脚本（相对本目录；空 = 不注入）
Script=
